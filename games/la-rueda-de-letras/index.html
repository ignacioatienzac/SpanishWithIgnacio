<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Rueda de Letras</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="hero">
        <div class="container">
            <h1>La Rueda de Letras</h1>
            <p>Forma palabras con la rueda, complétalas en el crucigrama y descubre todas las pistas del día.</p>
        </div>
    </header>

    <main class="container">
        <section class="toolbar">
            <div class="date-control">
                <label for="datePicker">Selecciona un día</label>
                <input type="date" id="datePicker">
                <button id="loadPuzzle">Cargar reto</button>
            </div>
            <div class="actions">
                <button id="revealBase" class="ghost">Pista palabra base</button>
                <button id="toggleClues" class="ghost">Mostrar pistas</button>
            </div>
        </section>

        <section class="game-layout">
            <div class="grid-card">
                <div class="card-header">
                    <div>
                        <p class="eyebrow">Crucigrama diario</p>
                        <h2 id="puzzleTitle">Juego del día</h2>
                    </div>
                    <div class="badge" id="progressBadge">0 / 0</div>
                </div>
                <div id="grid" class="crossword"></div>
                <div id="victory" class="victory hidden">¡Felicidades! Has completado el crucigrama 🎉</div>
            </div>

            <div class="sidebar">
                <div class="wheel-card">
                    <p class="eyebrow">Rueda de letras</p>
                    <h3>Arma palabras</h3>
                    <div id="wheel" class="wheel"></div>
                    <div class="guess-display" id="currentGuess">&nbsp;</div>
                    <div class="wheel-actions">
                        <button id="shuffle">Mezclar</button>
                        <button id="backspace" class="ghost">Borrar</button>
                        <button id="submit">Comprobar</button>
                    </div>
                    <p id="feedback" class="feedback"></p>
                </div>

                <div class="clues-card">
                    <div class="card-header">
                        <p class="eyebrow">Pistas</p>
                        <h3>Traducciones</h3>
                    </div>
                    <div id="clueList" class="clues hidden"></div>
                </div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
