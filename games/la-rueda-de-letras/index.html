<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="../../language-init.js"></script>
    <title>Letter Loop</title>
    <link rel="icon" type="image/png" href="../../images/favicon.png">
    <link rel="stylesheet" href="../../style.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@900&family=Montserrat:wght@400;700&family=Oswald:wght@500&family=Roboto:wght@300&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="../../script.js" defer></script>
</head>
<body>
    <header class="main-header">
        <div class="header-container">
            <div class="logo">
                <span class="logo-main">Spanish with</span>
                <span class="logo-script">Ignacio</span>
            </div>

            <div class="language-switcher language-switcher--mobile">
                <button class="language-switcher__button" type="button" aria-expanded="false" aria-haspopup="listbox" data-language-toggle>
                    <span class="language-switcher__flag" aria-hidden="true">🇪🇸</span>
                    <span class="language-switcher__chevron" aria-hidden="true">▾</span>
                    <span class="language-switcher__sr-label">Español</span>
                </button>
                <div class="language-switcher__menu" role="listbox" aria-hidden="true">
                    <button class="language-switcher__option" type="button" role="option" aria-selected="false" data-language-option="es" aria-label="Español">
                        <span class="language-switcher__option-flag" aria-hidden="true">🇪🇸</span>
                        <span class="language-switcher__sr-label">Español</span>
                    </button>
                    <button class="language-switcher__option" type="button" role="option" aria-selected="false" data-language-option="en" aria-label="English">
                        <span class="language-switcher__option-flag" aria-hidden="true">🇬🇧</span>
                        <span class="language-switcher__sr-label">English</span>
                    </button>
                </div>
            </div>

            <button class="menu-toggle" aria-expanded="false" aria-controls="primary-navigation" aria-label="Open navigation menu">
                <span class="menu-toggle__bar"></span>
                <span class="menu-toggle__bar"></span>
                <span class="menu-toggle__bar"></span>
            </button>
            <nav class="main-nav" id="primary-navigation">
                <ul>
                    <li><a href="../../index.html" data-i18n-es="Inicio">Home</a></li>
                    <li><a href="../../students/index.html" data-i18n-es="Recursos">Resources</a></li>
                    <li><a href="../index.html" class="active" data-i18n-es="Juegos">Games</a></li>
                    <li class="language-switcher language-switcher--desktop">
                        <button class="language-switcher__button" type="button" aria-expanded="false" aria-haspopup="listbox" data-language-toggle>
                            <span class="language-switcher__flag" aria-hidden="true">🇪🇸</span>
                            <span class="language-switcher__chevron" aria-hidden="true">▾</span>
                            <span class="language-switcher__sr-label">Español</span>
                        </button>
                        <div class="language-switcher__menu" role="listbox" aria-hidden="true">
                            <button class="language-switcher__option" type="button" role="option" aria-selected="false" data-language-option="es" aria-label="Español">
                                <span class="language-switcher__option-flag" aria-hidden="true">🇪🇸</span>
                                <span class="language-switcher__sr-label">Español</span>
                            </button>
                            <button class="language-switcher__option" type="button" role="option" aria-selected="false" data-language-option="en" aria-label="English">
                                <span class="language-switcher__option-flag" aria-hidden="true">🇬🇧</span>
                                <span class="language-switcher__sr-label">English</span>
                            </button>
                        </div>
                    </li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container">
        <section class="toolbar">
            <div class="toolbar-left">
                <div class="date-control">
                    <button id="calendar-button" class="calendar-button" title="Choose another day" aria-label="Choose another day">📅</button>
                </div>
                <div class="toolbar-title">
                    <h2 id="puzzleTitle">Puzzle of the day</h2>
                </div>
            </div>
        </section>

        <section class="game-layout">
                <div class="grid-card">
                <div class="card-header card-header--compact">
                    <div class="badge" id="progressBadge">0 / 0</div>
                </div>
                <div id="grid" class="crossword"></div>
                <div class="avatar-placement">
                    <div class="toolbar-avatar wordle-avatar">
                        <img src="../../images/thinking.webp" alt="">
                    </div>
                    <div class="avatar-bubble" aria-live="polite" aria-atomic="true" aria-hidden="true"></div>
                </div>
                <div id="victory" class="victory hidden">Congratulations! You solved the crossword 🎉</div>
            </div>

            <div class="sidebar">
                <div class="wheel-card">
                    <p class="eyebrow">Letter wheel</p>
                    <h3>Build words</h3>
                    <div id="wheel" class="wheel"></div>
                    <div class="guess-display" id="currentGuess">&nbsp;</div>
                    <div class="wheel-actions">
                        <button id="shuffle">Shuffle</button>
                        <button id="backspace" class="ghost">Delete</button>
                        <button id="submit">Check</button>
                    </div>
                    <p id="feedback" class="feedback"></p>
                </div>

                <div class="clues-card">
                    <div class="card-header">
                        <div class="clue-header">
                            <div class="clue-actions">
                                <button id="toggleClues" class="ghost">Show clues 👀</button>
                                <button id="revealBase" class="ghost">Base word hint</button>
                            </div>
                        </div>
                    </div>
                    <div id="cluesWrapper" class="clues-wrapper">
                        <div id="clueList" class="clues"></div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="site-footer__content">
            <div class="site-footer__section site-footer__section--contact">
                <p class="site-footer__contact">
                    <span class="site-footer__contact--desktop">For collaborations or to report bugs, email me at <a class="site-footer__contact-link" href="mailto:spanishwithignacio@gmail.com">spanishwithignacio@gmail.com</a>.</span>
                    <span class="site-footer__contact--mobile">Contact:<br><a class="site-footer__contact-link" href="mailto:spanishwithignacio@gmail.com">spanishwithignacio@gmail.com</a></span>
                </p>
            </div>
            <div class="site-footer__section site-footer__section--brand">
                <p class="site-footer__brand">Spanish with Ignacio</p>
            </div>
            <div class="site-footer__section site-footer__section--social" aria-label="Redes sociales">
                <a class="site-footer__social-link" href="https://www.instagram.com/spanishwithignacio/" target="_blank" rel="noopener noreferrer">
                    <img src="../../images/instagram_logo.png" alt="Instagram" class="site-footer__social-icon">
                </a>
                <a class="site-footer__social-link" href="https://www.youtube.com/@SpanishwithIgnacio" target="_blank" rel="noopener noreferrer">
                    <img src="../../images/youtube_logo.png" alt="YouTube" class="site-footer__social-icon">
                </a>
                <a class="site-footer__social-link" href="https://www.facebook.com/people/Spanish-With-Ignacio/61560429119394/" target="_blank" rel="noopener noreferrer">
                    <img src="../../images/facebook_logo.png" alt="Facebook" class="site-footer__social-icon">
                </a>
                <a class="site-footer__social-link" href="https://www.threads.com/@spanishwithignacio?igshid=NTc4MTIwNjQ2YQ==" target="_blank" rel="noopener noreferrer">
                    <img src="../../images/threads_logo.png" alt="Threads" class="site-footer__social-icon">
                </a>
            </div>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
