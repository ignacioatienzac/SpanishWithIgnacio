<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Generador de Crucigramas</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@900&family=Montserrat:wght@400;700&family=Oswald:wght@500&family=Roboto:wght@300&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom Keyframes for specific game animations */
        @keyframes flipIn {
            0% { transform: rotateY(90deg); }
            50% { transform: rotateY(-10deg); }
            100% { transform: rotateY(0deg); }
        }
        .animate-flip {
            animation: flipIn 0.6s ease forwards;
        }

        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-5px); }
            100% { transform: translateX(0); }
        }
        .animate-shake {
            animation: shake 0.4s ease-in-out;
        }

        /* Prevent pull-to-refresh and selection on mobile for better game feel */
        body {
            overscroll-behavior-y: contain;
            user-select: none;
            -webkit-user-select: none;
        }

        /* --- STYLES FOR HEADER & FOOTER (Ported from style.css) --- */
        
        :root {
            --primary-color: #c0392b; /* A warm Spanish red */
            --secondary-color: #2c3e50; /* A dark, professional blue/grey */
            --background-color: #ecf0f1; /* A light grey background */
            --text-color: #34495e;
        }

        @font-face {
            font-family: 'Aston Script';
            src: local('Aston Script'), url('fonts/Aston Script.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        /* Typography overrides for Header/Footer */
        .swi-font-montserrat { font-family: 'Montserrat', sans-serif; }
        .swi-font-inter { font-family: 'Inter', sans-serif; }
        .swi-font-script { font-family: 'Aston Script', cursive; }

        /* Header Styles */
        .main-header {
            background-color: #ffffff;
            padding: 1rem 2rem;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            width: 100%;
            position: relative;
            z-index: 40; /* High enough but below game flying letters (z-50) */
        }

        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
            flex-wrap: wrap;
        }

        /* Logo */
        .logo {
            display: flex;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin: 0.5rem 0;
            text-decoration: none;
        }

        .logo .logo-main {
            font-family: 'Inter', sans-serif;
            font-weight: 900;
            font-size: 1.6em;
            color: var(--secondary-color);
        }

        .logo .logo-script {
            font-family: 'Aston Script', cursive;
            font-size: 2.4em;
            color: var(--primary-color);
            line-height: 1;
        }

        /* Navigation */
        .main-nav {
            transition: max-height 0.35s ease, opacity 0.35s ease;
        }

        .main-nav ul {
            list-style-type: none;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            padding: 0;
            margin: 0;
        }

        .main-nav ul li {
            margin-left: 25px;
            margin-top: 5px;
            margin-bottom: 5px;
        }

        .main-nav ul li a {
            text-decoration: none;
            color: var(--secondary-color);
            font-weight: 700;
            padding: 5px 10px;
            border-radius: 5px;
            transition: background-color 0.3s ease, color 0.3s ease;
            font-family: 'Montserrat', sans-serif;
            font-size: 1rem;
        }

        .main-nav ul li a:hover,
        .main-nav ul li a.active {
            background-color: var(--primary-color);
            color: #ffffff;
        }

        /* Language Switcher */
        .language-switcher { position: relative; }
        .language-switcher--mobile { display: none; margin-right: 0.75rem; }
        
        .language-switcher__button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.35rem;
            padding: 10px 14px;
            border-radius: 999px;
            border: none;
            background: linear-gradient(145deg, #f2f4f7, #d9dde3);
            cursor: pointer;
            font-weight: 700;
            color: #1f2933;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.08);
            min-height: 38px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.9rem;
        }

        .language-switcher__button:hover {
            transform: translateY(-1px);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.16);
        }

        .language-switcher__menu {
            position: absolute;
            top: calc(100% + 6px);
            left: 0; /* Or right depending on context, fixed in component */
            background: linear-gradient(145deg, #f2f4f7, #d9dde3);
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            padding: 8px 10px;
            min-width: 160px;
            z-index: 50;
        }
        
        .language-switcher__option {
            width: 100%;
            padding: 10px 12px;
            border: none;
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.35rem;
            border-radius: 8px;
            cursor: pointer;
            color: #1f2933;
            font-weight: 700;
            font-family: 'Montserrat', sans-serif;
        }
        
        .language-switcher__option:hover { background: rgba(31, 41, 51, 0.06); }
        .language-switcher__option[aria-selected="true"] { background: rgba(31, 41, 51, 0.12); }

        /* Menu Toggle (Hamburger) */
        .menu-toggle {
            display: none;
            background: transparent;
            border: none;
            cursor: pointer;
            flex-direction: column;
            gap: 6px;
            padding: 0.5rem;
        }

        .menu-toggle__bar {
            width: 26px;
            height: 3px;
            background-color: var(--secondary-color);
            border-radius: 2px;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }

        /* Footer Styles */
        .site-footer {
            background-color: #ffffff;
            border-top: 1px solid rgba(15, 23, 42, 0.08);
            color: #0f172a;
            padding: 1.5rem 1rem;
            margin-top: auto; /* Push to bottom */
            width: 100%;
            font-family: 'Montserrat', sans-serif;
        }

        .site-footer__content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1.5rem;
            flex-wrap: wrap;
        }

        .site-footer__section {
            flex: 1 1 220px;
            min-width: 220px;
        }

        .site-footer__section--brand {
            display: flex;
            justify-content: center;
        }

        .site-footer__brand {
            font-family: 'Inter', sans-serif;
            font-weight: 900;
            font-size: 1.2rem;
            letter-spacing: 0.02em;
            text-align: center;
            color: var(--text-color);
        }

        .site-footer__contact {
            font-size: 0.95rem;
            line-height: 1.5;
            margin: 0;
            color: var(--text-color);
        }

        .site-footer__contact-link {
            color: #2563eb;
            font-weight: 700;
            text-decoration: none;
        }

        .site-footer__contact-link:hover { text-decoration: underline; }

        .site-footer__section--social {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 0.75rem;
        }

        .site-footer__social-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.25rem;
            border-radius: 8px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            color: var(--secondary-color);
        }

        .site-footer__social-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.08);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header-container {
                align-items: center;
                flex-wrap: nowrap;
                gap: 0.5rem;
            }
            .logo { flex: 1 1 auto; margin-left: 0; }
            .logo .logo-main { font-size: 1.2rem; }
            .logo .logo-script { font-size: 1.8rem; }
            
            .language-switcher--desktop { display: none; }
            .language-switcher--mobile { display: block; margin-left: auto; order: 2; }
            
            .menu-toggle { display: flex; order: 3; margin-left: 0.25rem; }
            
            .main-nav {
                width: 100%;
                order: 4;
                position: absolute;
                left: 0;
                top: calc(100% + 0.5rem);
                z-index: 45;
                max-height: 0;
                overflow: hidden;
                opacity: 0;
                background-color: #ffffff;
                box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
                border-radius: 10px;
            }
            
            .main-nav.open {
                max-height: 320px;
                opacity: 1;
            }
            
            .main-nav ul {
                flex-direction: column;
                align-items: flex-start;
                padding: 1rem 1.5rem;
                gap: 0.75rem;
            }
            
            .main-nav ul li { margin: 0; width: 100%; }
            .main-nav ul li a { display: block; width: 100%; padding: 0.75rem 0.5rem; }

            .site-footer__content {
                flex-direction: column;
                align-items: flex-start;
            }
            .site-footer__section--brand,
            .site-footer__section--social {
                justify-content: flex-start;
                width: 100%;
            }
        }
    </style>

</head>

</html>
